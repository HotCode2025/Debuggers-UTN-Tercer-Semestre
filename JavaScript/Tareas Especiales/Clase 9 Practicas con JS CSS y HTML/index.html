<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Document</title>    

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <section>
        <div class="color"></div>
        <div class="color"></div>
        <div class="color"></div>
        
        <div class="box">
            <div class="square" style="--i:0;"></div>
            <div class="square" style="--i:1;"></div>
            <div class="square" style="--i:2;"></div>
            <div class="square" style="--i:3;"></div>
            <div class="square" style="--i:4;"></div>
            <div class="container">
                <div class="form">
                    <h2>Login</h2>
                    <form id="loginForm">
                        <div class="inputBox">
                            <input type="text" id="username" placeholder="Username">
                        </div>
                        <div class="inputBox">
                            <input type="password" id="password" placeholder="Password" />
                        </div>
                        <div class="inputBox">
                            <input type="submit" value="Login" />
                        </div>
                        
                        <p id="mensaje" style="font-weight: 600; text-align: center; margin-bottom: 10px; height: 20px; transition: 0.3s;"></p>

                        <p class="forget">Forgot password ?
                            <a href="#">Click Here</a>
                        </p>
                        <p class="forget">Don't have an account ?
                            <a href="#">Sign Up</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>

<script>
    // Capturamos el formulario por su ID
    const loginForm = document.getElementById('loginForm');
    const mensaje = document.getElementById('mensaje');
    const container = document.querySelector('.container');

    // Cuando hacen clic en el botón Login
    loginForm.addEventListener('submit', function(event) {
        event.preventDefault(); 

        // Capturamos los valores que ingresó el usuario
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        // Validamos los datos ingresados
        if (user.trim() === '' || pass.trim() === '') {
            mensaje.style.color = '#FFFF99'; 
            mensaje.textContent = 'Por favor, completa todos los campos';
        } 
        else {
            // Mostramos mensaje de éxito
            mensaje.style.color = '#99ff99'; // Verde suave
            mensaje.textContent = `¡Bienvenido, ${user}!`;
            
            // Esperamos dos 2 segundos y limpiamos
            setTimeout(() => {
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
                mensaje.textContent = '';
            }, 2000);
        }
    });
</script>
