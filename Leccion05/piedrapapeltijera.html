<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piedra, papel y tijera</title>

    <script>
        function generarAleatorio(minimo, maximo) {
            let numeroRandom = Math.floor(Math.random() * (maximo - minimo + 1) + minimo);
            return numeroRandom;
        }

        // 1. será pidra - 2. sera papel y el 3 tijeta
        let jugador = 0;
        let maximo = 3;
        let minimo = 1;
//        let pc = Math.floor(Math.random() * (maximo - minimo + 1) + minimo);

        let pc = generarAleatorio(1, 3);

        jugador = prompt("Elige: 1 piedra, 2 papel, 3 tijera");
        
        //alert("Elige jugador " + jugador);

        if (jugador == 1) {
            alert("Elegiste piedra");
        }
        else if (jugador == 2) {
            alert("Elegiste papel");
        } 
        else if (jugador == 3) {
            alert("Elegiste tijera");
        } 
        else {
            alert("Elegiste perder");
        }

        // Combate
        if (pc == jugador) {
            alert("Empate");
        }
        else if (jugador == 1 && pc == 3) {
            alert("Ganaste");
        } 
        else if (jugador == 2 && pc == 1) {
            alert("Ganaste");
        }
        else if (jugador == 3 && pc == 2) {
            alert("Ganaste");
        }
        else {
            alert("Perdiste");
        }
    </script>

</head>
<body>
    <h1>Piedra, Papel y Tijera</h1>
</body>
</html>
